<!DOCTYPE html>
<html lang="en">
<head>
        <title>Research Assistant</title>
        <link rel="stylesheet" href="side_panel.css">
</head>
<body>
    <div class="container">
         <div class="side-panel">
            <h2>Research Assistant</h2>
            <p>Welcome to the Research Assistant! Here you can ask questions, get summaries, and receive recommendations based on your research needs.</p>
         </div>

         <div class="actions">
            <button id="summarization">Summarize</button>
         </div>

         <div class="actions">
            <button id="suggestion">Get Suggestions</button>
         </div>

         <div class="notes">
            <h3>Research Notes</h3>
            <textarea id="notes" placeholder="Write your research notes here..."></textarea>
            <button id="save-notes">Save Notes</button>
         </div>

         <div id="results"></div>
         <script src="side_panel.js"></script>
    </div>
</body>
</html>
